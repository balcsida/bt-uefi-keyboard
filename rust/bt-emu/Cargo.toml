[package]
name = "bt-emu"
description = "An emulated MT7922 Bluetooth controller with a BLE keyboard behind it, for the offline tests (QEMU usb-redir)"
edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true
publish = false

# A host program (std), never built for UEFI: scripts/qemu-driver-test.sh
# builds it with plain `cargo build -p bt-emu`.

[dependencies]
# The same bond files, key tables and Report Map parser the driver uses.
uefi-bt = { path = "../uefi-bt" }
# The MediaTek vendor channel's constants.
mtk-bt = { path = "../mtk-bt" }
# The keyboard's side of pairing (src/smp.rs): AES-128, AES-CMAC and P-256,
# the versions the driver's host stack already brings into Cargo.lock.
aes = "0.8"
cmac = "0.7"
p256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
