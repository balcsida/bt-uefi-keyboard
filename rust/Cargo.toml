[workspace]
resolver = "2"
members = ["mtk-bt", "uefi-bt", "bt-hci-probe", "bt-le-scan", "bt-kb-probe", "bt-kb-dxe", "bt-kb-log", "ebs-test", "bt-emu"]
# Plain `cargo test` runs the host-testable crates only; UEFI crates are built
# with `--target x86_64-unknown-uefi` (see scripts/build-rust.sh). bt-emu is a
# host program (the emulated controller and keyboard of the offline tests).
default-members = ["mtk-bt"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Dávid Balatoni <balcsida@gmail.com>"]
version = "0.1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# bt-emu is a debug build, and its "impostor" (bt-emu/src/smp.rs) tries up
# to a million passkeys, two AES operations each, while QEMU waits for the
# emulated controller: unoptimized that took two seconds, and the driver's
# USB transfers timed out (Nov 15).
[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.bt-emu]
opt-level = 2
