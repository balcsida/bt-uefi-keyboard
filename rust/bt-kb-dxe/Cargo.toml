[package]
name = "bt-kb-dxe"
edition.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true
build = "build.rs"

[features]
# Deliver key reports that arrived before the link was encrypted, once it is
# (the behaviour before Nov 3). Insecure: an unencrypted LE link has no
# integrity protection, so anyone in radio range could inject those. For
# experiments only; never in a build you install (see README, Security).
insecure-replay-unencrypted = []
# Pairing in firmware: with no keyboard paired (or when bt-kb-dxe.pair asks
# for it), the driver looks for a keyboard in pairing mode at boot, shows a
# passkey and pairs, with LE Secure Connections only. A bond made this way
# can't be pinned by the build: it is trusted because only pre-boot code
# can have stored it (see README, Security).
pairing = []
# ... and with LE legacy pairing too, for keyboards that can't do Secure
# Connections. Insecure against anyone in radio range while pairing is on
# offer: with legacy pairing the passkey proves nothing to the PC, so
# somebody else's device can pair in the keyboard's place and type.
insecure-legacy-pairing = ["pairing"]

[dependencies]
mtk-bt = { path = "../mtk-bt" }
uefi-bt = { path = "../uefi-bt", features = ["embassy", "panic-handler"] }
uefi = { version = "0.41", features = ["alloc", "global_allocator"] }
uefi-raw = "0.17"
# Queue sizes as in bt-kb-probe: TrouBLE's defaults lost key reports (Nov 1).
trouble-host = { version = "0.8", default-features = false, features = [
    "central", "scan", "gatt", "security", "legacy-pairing", "log",
    "default-packet-pool", "default-packet-pool-size-64",
    "gatt-client-notification-queue-size-32", "gatt-client-notification-max-subscribers-4",
    "l2cap-rx-queue-size-32", "connection-event-queue-size-8",
] }
bt-hci = { version = "0.10", default-features = false }
embassy-futures = "0.1"
embassy-time = "0.5"
log = "0.4"

[build-dependencies]
# The firmware image's SHA-256, pinned at build time (build.rs).
sha2 = "0.10"
